family: chitraksh-bg-test
  networkMode: awsvpc
  requiresCompatibilities:
    - FARGATE
  cpu: "256"
  memory: "512"
  executionRoleArn: <+input>
  containerDefinitions:
    - name: web
      image: <+artifact.image>
      portMappings:
        - containerPort: 80
          protocol: tcp
      essential: true
